  - id: idempotency
    conforms: true
    partial: true
    evidence: >-
      Every mutating split/voice-change operation accepts an optional uuid4 `idempotency_key` in the
      request body, with a dedicated `idempotency_key_used` error code. Partial because it is a body field
      rather than the conventional Idempotency-Key header, and the key de-duplicates submission only —
      it does not replay a completed response.
