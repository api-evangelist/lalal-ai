naftiko: 1.0.0-alpha2
info:
  label: LALAL.AI Multi-Stem & Batch Separation
  description: 'LALAL.AI multi-stem and batch processing. Extract up to six stems (vocals, drum, bass, piano,
    electric guitar, acoustic guitar) per source in a single request, or fan out batch jobs across multiple
    uploaded sources.'
  tags:
  - LALAL.AI
  - Multistem
  - Batch
  - Audio
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    LALAL_LICENSE_KEY: LALAL_LICENSE_KEY
capability:
  consumes:
  - type: http
    namespace: lalal-multistem
    baseUri: https://www.lalal.ai
    description: LALAL.AI multi-stem and batch separation surface.
    resources:
    - name: split-multistem
      path: /api/v1/split/multistem/
      operations:
      - name: startMultistem
        method: POST
        description: Extract a list of up to six stems from one source in a single task.
        outputRawFormat: json
        outputParameters:
        - name: task_id
          type: string
          value: $.task_id
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: split-batch-stem-separator
      path: /api/v1/split/batch/stem_separator/
      operations:
      - name: startBatchStemSeparation
        method: POST
        description: Run stem separation across multiple sources with a shared preset.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: split-batch-demuser
      path: /api/v1/split/batch/demuser/
      operations:
      - name: startBatchDemuser
        method: POST
        description: Batch demuser splits — isolate music from non-music across multiple sources.
        outputRawFormat: json
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: split-batch-voice-clean
      path: /api/v1/split/batch/voice_clean/
      operations:
      - name: startBatchVoiceClean
        method: POST
        description: Batch voice cleaning — remove background music and noise across multiple sources.
        outputRawFormat: json
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    authentication:
      type: apikey
      key: X-License-Key
      value: '{{env.LALAL_LICENSE_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: lalal-multistem-rest
    port: 8080
    description: REST adapter exposing multistem and batch separation.
    resources:
    - name: multistem
      path: /v1/multistem
      operations:
      - name: createMultistemJob
        method: POST
        description: Create a multistem extraction job.
