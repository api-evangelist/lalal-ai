naftiko: 1.0.0-alpha2
info:
  label: LALAL.AI Voice Cleaning
  description: 'LALAL.AI voice cleaning capability — extracts the "voice" stem from spoken-word recordings,
    removing background music and ambient noise with configurable 3-level noise cancelling and optional dereverb.'
  tags:
  - LALAL.AI
  - Voice Cleaning
  - Noise Removal
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    LALAL_LICENSE_KEY: LALAL_LICENSE_KEY
capability:
  consumes:
  - type: http
    namespace: lalal-voice-clean
    baseUri: https://www.lalal.ai
    description: LALAL.AI voice cleaning business capability.
    resources:
    - name: split-voice-clean
      path: /api/v1/split/voice_clean/
      operations:
      - name: startVoiceClean
        method: POST
        description: Start a voice-clean task on an uploaded source.
        outputRawFormat: json
        outputParameters:
        - name: task_id
          type: string
          value: $.task_id
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: split-demuser
      path: /api/v1/split/demuser/
      operations:
      - name: startDemuser
        method: POST
        description: Isolate the music component from a mixed recording.
        outputRawFormat: json
        outputParameters:
        - name: task_id
          type: string
          value: $.task_id
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    authentication:
      type: apikey
      key: X-License-Key
      value: '{{env.LALAL_LICENSE_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: lalal-voice-clean-rest
    port: 8080
    description: REST adapter exposing LALAL.AI voice cleaning.
    resources:
    - name: voice-clean
      path: /v1/voice-clean
      operations:
      - name: createVoiceCleanJob
        method: POST
        description: Create a voice-clean job for a source recording.
