    remediation: Fix the field named in detail[].loc. Never retry unchanged.
  - status: 429
    title: Too Many Requests
    schema: CommonErrorResponse
    source_operations:
      - openapi/lalal-ai-common-api-openapi.yml#check_check
    description: >-
      Declared on the polling endpoint only. No Retry-After or RateLimit-* header is documented or was
      observed, so back off exponentially — there is no published budget to read.
    remediation: Exponential backoff on the /check/ poll loop; widen the poll interval.

error_codes:
  - code: idempotency_key_used
    enum: TaskStartErrorCodes
    message: Idempotency key has already been used.
    meaning: >-
      The uuid4 idempotency_key was already consumed by a task that has begun processing. The key
      de-duplicates submission only; it does not replay the original response.
    action: >-
      Terminal. Poll /api/v1/check/ for the task the original submission created rather than resubmitting
      with a new key — a new key will start a second job and consume minutes twice.
    retryable: false
  - code: internal_error
    enum: TaskStartErrorCodes
    meaning: Server-side failure starting the task.
    action: Retry with the SAME idempotency_key.
    retryable: true
  - code: exceeded_duration
    enum: LicenseErrorCodes
    meaning: The license has no processing minutes left for this job.
    action: >-
      Terminal. Check POST /api/v1/limits/minutes_left/ and top up. Minutes are consumed as
      file_length x number_of_selected_stems.
    retryable: false
  - code: exceeded_size
    enum: LicenseErrorCodes
    meaning: The uploaded file exceeds the size ceiling for this license.
    action: Terminal. Reduce the file or use a license with a higher upload ceiling.
    retryable: false
  - code: max_duration
    enum: LicenseErrorCodes
    meaning: The media file is longer than this license permits.
    action: Terminal. Split the source file or upgrade the license.
    retryable: false
  - code: batch_not_avaliable
    enum: LicenseErrorCodes
    meaning: >-
      Batch processing is not available on this license. (The typo is the provider's — the enum value is
      literally "batch_not_avaliable" and must be matched verbatim.)
    action: >-
      Terminal. Fall back to the single-file /api/v1/split/* endpoints, or move to a plan that includes
      batch processing.
    retryable: false

task_states:
  source: CheckV1Response result union
  states:
    - state: success
      schema: CheckV1SuccessResult
      note: Carries SplitTracksResult.tracks[] with signed download URLs.
    - state: progress
      schema: CheckV1ProgressResult
      note: progress is an integer 0..100.
    - state: error
      schema: CheckV1ErrorResult
      note: Carries a TaskMetaError. This is where an async failure surfaces — the HTTP status is 200.
    - state: cancelled
      schema: CheckV1CancelledResult
  note: >-
    The most important error-handling fact about this API — a job that FAILS returns HTTP 200 from
    /api/v1/check/ with state "error" in the body. Status-code-only error handling will treat every failed
    separation as a success.

