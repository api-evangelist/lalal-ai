  openapi/_original/lalal-ai-api-openapi.yml (4xx responses + components.schemas), verified against the
  live https://www.lalal.ai/api/v1/openapi.json, and enriched from https://www.lalal.ai/api/v1/docs/
docs: https://www.lalal.ai/api/v1/docs/
provider: LALAL.AI
provider_id: lalal-ai

format: custom-json
rfc9457: false
content_type: application/json
note: >-
  LALAL.AI does not use RFC 9457 application/problem+json. The v1 envelope is its own two-field shape —
  {detail, code} — plus a FastAPI/Pydantic validation shape reusing the same `detail` key with a different
  type. `code` is the stable machine-readable handle; `detail` is prose and must not be matched on.
  The changelog dates this: "Added clear, structured error responses to the Developer API" (2026-02-17).

envelopes:
  - name: ApiV1ErrorResponse
    fields:
      detail: {type: string, required: true, description: Error message.}
      code: {type: string, required: true, description: Error code.}
    example: {detail: Idempotency key has already been used., code: idempotency_key_used}
  - name: CommonErrorResponse
    fields:
      detail:
        type: string | object | array<object>
        required: true
        description: >-
          Polymorphic. On a validation failure it is an array of {loc, msg, type} items, e.g.
          [{loc: [body, split_input, source_id], msg: Field required, type: missing}].
  - name: FailedTaskStart
    fields:
      status: {type: string, const: error}
      error: {type: string, required: true}
      code: {type: string, required: true, enum_of: [TaskStartErrorCodes, LicenseErrorCodes]}
      source_id: {type: string, required: true}
    note: >-
      Returned INSIDE a 200 OK BatchTasksResponse.results[], discriminated on `status`. A batch call can
      report per-item failure with no non-2xx HTTP status anywhere.
  - name: ErrorResult
    fields:
      status: {type: string, const: server_error}
      error: {type: string, required: true}
    examples: [Permission denied, Task is not in progress state, Failed to extract information about task]
    note: Cancellation-path failure, also delivered inside a 200 response.
  - name: TaskMetaError
    fields:
      detail: {type: string, required: true}
      code: {type: string, nullable: true}
      id: {type: string, nullable: true}
    note: Per-task error surfaced by /api/v1/check/ as CheckV1ErrorResult.

