    schema: '{detail: string}'
    observed: true
    observed_body: '{"detail": "Provide license key in ''X-License-Key'' header"}'
    observed_url: https://www.lalal.ai/api/v1/check/
    observed_date: '2026-08-13'
    description: >-
      Not declared in the OpenAPI document, but this is what the API actually returns when the
      X-License-Key header is absent. Captured by live unauthenticated probe.
    remediation: Send the X-License-Key header. No WWW-Authenticate challenge is returned.
    method: probed
  - status: 422
    title: Unprocessable Entity
    schema: CommonErrorResponse
    description: >-
      Pydantic request-body validation failure. `detail` is an array of {loc, msg, type} pointing at the
      offending field path.
    source_operations:
